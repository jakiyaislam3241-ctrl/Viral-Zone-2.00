<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD VIRAL</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (Compat Version for Direct Browser Scripting) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #07040d;
            --card-bg: rgba(23, 14, 38, 0.85);
            --border-purple: rgba(168, 85, 247, 0.3);
            --primary-purple: #a855f7;
            --purple-glow: #9333ea;
            --text-main: #f3e8ff;
            --text-dim: #a78bfa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #1c0836 0%, var(--bg-color) 80%);
            color: var(--text-main); min-height: 100vh; padding: 15px;
        }

        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .header h1 { font-size: 20px; color: #fff; font-weight: bold; }
        .header .badge { background: #d946ef; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

        .search-box { position: relative; margin-bottom: 20px; }
        .search-box input {
            width: 100%; padding: 10px 10px 10px 35px; background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-purple); border-radius: 8px; color: #fff; outline: none; font-size: 13px;
        }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 13px; }

        .section-title { font-size: 14px; font-weight: bold; color: var(--primary-purple); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

        .video-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

        .video-card {
            background: var(--card-bg); border: 1px solid var(--border-purple);
            border-radius: 10px; overflow: hidden; cursor: pointer;
        }

        .video-card img { width: 100%; height: 110px; object-fit: cover; display: block; }
        .video-card .info { padding: 8px; }
        .video-card .title { font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Player Modal */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:99; justify-content:center; align-items:center; }
        .modal-content { background: var(--card-bg); border:1px solid var(--border-purple); padding:20px; border-radius:15px; text-align:center; width:90%; max-width:400px; position:relative; }
        .close-btn { position: absolute; right: 15px; top: 12px; background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
        .btn-ad { background: linear-gradient(135deg, var(--primary-purple), var(--purple-glow)); color:white; border:none; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer; margin-top:15px; width:100%; }
        video { width:100%; border-radius:10px; margin-top:10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>BD VIRAL <span class="badge">LINK</span></h1>
    </div>

    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="Search Movies, Series, Videos..." oninput="filterVideos()">
    </div>

    <div class="section-title">
        <i class="fa-solid fa-bolt"></i> Trending Now
    </div>

    <div class="video-grid" id="video-list"></div>

    <!-- Unlock Modal -->
    <div class="modal" id="unlock-modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <h3 id="modal-title" style="font-size: 14px; margin-top: 10px;">ভিডিও আনলক করুন</h3>
            <button class="btn-ad" id="ad-btn" onclick="openAdLink()">🔓 Watch Ad to Unlock</button>
            <div id="player-wrap" style="display:none;">
                <video id="main-player" controls controlsList="nodownload">
                    <source id="video-src" src="" type="video/mp4">
                </video>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg) tg.expand();

        const firebaseConfig = {
            apiKey: "AIzaSyAaN2JFDn7SbEGaUWFjxVF6Dk32TaB4h3k",
            authDomain: "viral-zone-f39b4.firebaseapp.com",
            databaseURL: "https://viral-zone-f39b4-default-rtdb.firebaseio.com",
            projectId: "viral-zone-f39b4",
            storageBucket: "viral-zone-f39b4.firebasestorage.app",
            messagingSenderId: "722917065467",
            appId: "1:722917065467:web:4e65fd62a81503ed96665e",
            measurementId: "G-2B75VFV2BB"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let adLink = "https://telegram.org";
        let timerSeconds = 10;
        let sampleVideos = [];
        let activeVideo = null;

        function fetchCloudData() {
            const container = document.getElementById('video-list');
            container.innerHTML = "<p style='grid-column:1/-1; text-align:center; color:#aaa; font-size:12px; padding:20px;'>Loading videos...</p>";
            
            db.ref('/').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    adLink = data.adLink || adLink;
                    timerSeconds = data.adTimer || timerSeconds;
                    sampleVideos = data.videos || [];
                    renderVideos(sampleVideos);
                } else {
                    container.innerHTML = "<p style='grid-column:1/-1; text-align:center; color:#aaa; font-size:12px; padding:20px;'>কোনো ভিডিও পাওয়া যায়নি!</p>";
                }
            }, (error) => {
                console.error("Firebase Error:", error);
                container.innerHTML = "<p style='grid-column:1/-1; text-align:center; color:#f87171; font-size:12px; padding:20px;'>Video load korte somosya hochhe.</p>";
            });
        }

        function renderVideos(list) {
            const container = document.getElementById('video-list');
            if (!list || list.length === 0) {
                container.innerHTML = "<p style='grid-column:1/-1; text-align:center; color:#aaa; font-size:12px; padding:20px;'>কোনো ভিডিও পাওয়া যায়নি!</p>";
                return;
            }
            container.innerHTML = list.map(v => `
                <div class="video-card" onclick="openModal('${v.url}', '${v.title}')">
                    <img src="${v.thumb}" alt="thumb">
                    <div class="info">
                        <div class="title">${v.title}</div>
                    </div>
                </div>
            `).join('');
        }

        function filterVideos() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = sampleVideos.filter(v => v.title.toLowerCase().includes(query));
            renderVideos(filtered);
        }

        function openModal(url, title) {
            activeVideo = url;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('unlock-modal').style.display = 'flex';
            document.getElementById('player-wrap').style.display = 'none';
            document.getElementById('ad-btn').style.display = 'block';
            document.getElementById('ad-btn').innerText = "🔓 Watch Ad to Unlock";
            document.getElementById('ad-btn').disabled = false;
        }

        function closeModal() {
            document.getElementById('unlock-modal').style.display = 'none';
            const player = document.getElementById('main-player');
            player.pause();
            player.src = "";
        }

        function openAdLink() {
            window.open(adLink, '_blank');
            let btn = document.getElementById('ad-btn');
            let count = timerSeconds;
            btn.disabled = true;
            
            let timer = setInterval(() => {
                btn.innerText = `Wait (${count}s)...`;
                count--;
                if (count < 0) {
                    clearInterval(timer);
                    btn.style.display = 'none';
                    document.getElementById('player-wrap').style.display = 'block';
                    document.getElementById('main-player').src = activeVideo;
                }
            }, 1000);
        }

        fetchCloudData();
    </script>
</body>
</html>
