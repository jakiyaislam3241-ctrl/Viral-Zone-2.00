<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - BD Viral Link</title>
  <!-- Firebase App & Realtime Database CDN (v8 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b0e14; color: #ffffff; padding: 20px; }
    
    .admin-card { background: #121721; border: 1px solid #ffcc00; max-width: 650px; margin: 0 auto 30px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .admin-card h2 { color: #ffcc00; font-size: 20px; text-align: center; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    
    .form-group { margin-bottom: 15px; }
    label { font-size: 13px; color: #ffcc00; font-weight: bold; display: block; margin-bottom: 6px; }
    input, textarea { width: 100%; background: #1a2230; border: 1px solid #2d3748; color: #fff; padding: 12px; border-radius: 6px; font-size: 14px; }
    input:focus, textarea:focus { border-color: #ffcc00; outline: none; }
    
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .btn-upload { background: #ffcc00; color: #000; font-weight: bold; border: none; padding: 14px; width: 100%; border-radius: 6px; font-size: 16px; margin-top: 15px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-upload:hover { background: #e6b800; }

    .list-card { background: #121721; border: 1px solid #2d3748; max-width: 650px; margin: 0 auto; padding: 20px; border-radius: 12px; }
    .list-header { color: #ffcc00; font-size: 16px; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #2d3748; padding-bottom: 8px; }
    
    .item-row { background: #1a2230; border: 1px solid #2d3748; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
    .item-row img { width: 60px; height: 45px; object-fit: cover; border-radius: 4px; background: #0b0e14; }
    .item-info { flex: 1; }
    .item-title { font-size: 13px; font-weight: bold; color: #fff; margin-bottom: 4px; }
    .item-sub { font-size: 11px; color: #a0aec0; }
    
    .item-actions { display: flex; gap: 6px; }
    .btn-action { padding: 6px 10px; border-radius: 4px; border: none; font-size: 12px; font-weight: bold; cursor: pointer; }
    .btn-edit { background: #ffcc00; color: #000; }
    .btn-delete { background: #ff4757; color: #fff; }

    .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:none; justify-content:center; align-items:center; z-index:1000; padding:15px; }
    .modal-box { background:#121721; border:1px solid #ffcc00; width:100%; max-width:500px; padding:20px; border-radius:10px; }
  </style>
</head>
<body>

  <div class="admin-card">
    <h2><i class="fa-solid fa-user-shield"></i> Admin Control Panel</h2>
    
    <form id="adminForm">
      <div class="form-group">
        <label><i class="fa-solid fa-heading"></i> Video Title</label>
        <input type="text" id="vTitle" placeholder="Enter video title..." required>
      </div>

      <div class="form-group">
        <label><i class="fa-solid fa-image"></i> Thumbnail Image Link</label>
        <input type="url" id="vThumb" placeholder="https://image-link.com/photo.jpg" required>
      </div>

      <div class="form-group">
        <label><i class="fa-solid fa-video"></i> Video Link(s) (For multiple parts use comma ,)</label>
        <textarea id="vLinks" rows="3" placeholder="https://video1.mp4, https://video2.mp4" required></textarea>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label><i class="fa-solid fa-layer-group"></i> Ads Limit</label>
          <input type="number" id="vAdLimit" value="1" min="1" required>
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-clock"></i> Ads Duration (Seconds)</label>
          <input type="number" id="vAdDuration" value="10" min="1" required>
        </div>
      </div>

      <div class="form-group">
        <label><i class="fa-solid fa-link"></i> Adsterra Direct Link (Ads Link)</label>
        <input type="url" id="vAdLink" placeholder="https://www.adsterra-direct-link.com/..." required>
      </div>

      <button type="submit" class="btn-upload"><i class="fa-solid fa-cloud-arrow-up"></i> Upload to User Panel</button>
    </form>
  </div>

  <div class="list-card">
    <div class="list-header"><i class="fa-solid fa-list"></i> Uploaded Videos List</div>
    <div id="videoListContainer">
      <div style="text-align:center; color:#a0aec0; padding:15px;">Loading video list...</div>
    </div>
  </div>

  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <h3 style="color:#ffcc00; margin-bottom:15px;"><i class="fa-solid fa-pen-to-square"></i> Edit Video Details</h3>
      <input type="hidden" id="editKey">
      
      <div class="form-group">
        <label>Video Title</label>
        <input type="text" id="editTitle">
      </div>

      <div class="form-group">
        <label>Thumbnail Image Link</label>
        <input type="url" id="editThumb">
      </div>

      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="btn-upload" onclick="saveVideoEdit()" style="margin-top:0;"><i class="fa-solid fa-check"></i> Save Changes</button>
        <button class="btn-action btn-delete" onclick="closeEditModal()" style="padding:12px; flex:1;">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // Updated Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBEgPmBYdu0hxRY6qilp0Aw6qIhL7FrnoM",
      authDomain: "first-app-c33be.firebaseapp.com",
      databaseURL: "https://first-app-c33be-default-rtdb.firebaseio.com",
      projectId: "first-app-c33be",
      storageBucket: "first-app-c33be.firebasestorage.app",
      messagingSenderId: "179840421702",
      appId: "1:179840421702:web:2540c2b4ee48baec849f47",
      measurementId: "G-VCMH0W3MJP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allVideos = {};

    document.getElementById('adminForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const title = document.getElementById('vTitle').value;
      const thumbnail = document.getElementById('vThumb').value;
      const rawLinks = document.getElementById('vLinks').value;
      const adLimit = document.getElementById('vAdLimit').value;
      const adDuration = document.getElementById('vAdDuration').value;
      const adLink = document.getElementById('vAdLink').value;

      const partsArr = rawLinks.split(',').map(url => url.trim());

      const payload = {
        title: title,
        thumbnail: thumbnail,
        parts: partsArr,
        adLimit: parseInt(adLimit),
        adDuration: parseInt(adDuration),
        adLink: adLink,
        likes: 0,
        downloads: 0,
        views: 0,
        createdAt: Date.now()
      };

      db.ref('videos').push(payload)
        .then(() => {
          alert('✅ Video uploaded successfully to User Panel!');
          document.getElementById('adminForm').reset();
        })
        .catch((err) => {
          alert('❌ Upload failed: ' + err.message);
        });
    });

    const videoRef = db.ref('videos');
    videoRef.on('value', (snapshot) => {
      allVideos = snapshot.val() || {};
      const container = document.getElementById('videoListContainer');
      container.innerHTML = '';

      const keys = Object.keys(allVideos);
      if (keys.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#a0aec0; padding:15px;">No uploaded videos available.</div>';
        return;
      }

      keys.forEach((key) => {
        const item = allVideos[key];
        const partsCount = item.parts ? item.parts.length : 1;
        const thumb = item.thumbnail || item.thumb || 'https://via.placeholder.com/60x45?text=No+Img';

        container.innerHTML += `
          <div class="item-row">
            <img src="${thumb}" referrerpolicy="no-referrer" onerror="this.src='https://via.placeholder.com/60x45?text=No+Img'">
            <div class="item-info">
              <div class="item-title">${item.title}</div>
              <div class="item-sub">${partsCount} Parts | Views: ${item.views || 0}</div>
            </div>
            <div class="item-actions">
              <button class="btn-action btn-edit" onclick="openEditModal('${key}')"><i class="fa-solid fa-pen"></i></button>
              <button class="btn-action btn-delete" onclick="deleteVideo('${key}')"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `;
      });
    });

    window.deleteVideo = function(key) {
      if (confirm('Are you sure you want to delete this video?')) {
        db.ref('videos/' + key).remove()
          .then(() => alert('🗑️ Video deleted successfully!'))
          .catch((err) => alert('Error: ' + err.message));
      }
    };

    window.openEditModal = function(key) {
      const item = allVideos[key];
      if (!item) return;
      document.getElementById('editKey').value = key;
      document.getElementById('editTitle').value = item.title || '';
      document.getElementById('editThumb').value = item.thumbnail || item.thumb || '';
      document.getElementById('editModal').style.display = 'flex';
    };

    window.saveVideoEdit = function() {
      const key = document.getElementById('editKey').value;
      const newTitle = document.getElementById('editTitle').value;
      const newThumb = document.getElementById('editThumb').value;

      if (!newTitle) {
        alert('Title cannot be empty!');
        return;
      }

      db.ref('videos/' + key).update({
        title: newTitle,
        thumbnail: newThumb
      }).then(() => {
        alert('✏️ Video updated successfully!');
        closeEditModal();
      }).catch((err) => alert('Error: ' + err.message));
    };

    window.closeEditModal = function() {
      document.getElementById('editModal').style.display = 'none';
    };
  </script>
</body>
</html>
