<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - BD Viral Link</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b0e14; color: #ffffff; padding: 20px; }
    
    .admin-card { background: #121721; border: 1px solid #ffcc00; max-width: 550px; margin: 0 auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .admin-card h2 { color: #ffcc00; font-size: 20px; text-align: center; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    
    .form-group { margin-bottom: 15px; }
    label { font-size: 13px; color: #ffcc00; font-weight: bold; display: block; margin-bottom: 6px; }
    input, textarea { width: 100%; background: #1a2230; border: 1px solid #2d3748; color: #fff; padding: 12px; border-radius: 6px; font-size: 14px; }
    input:focus, textarea:focus { border-color: #ffcc00; outline: none; }
    
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .btn-upload { background: #ffcc00; color: #000; font-weight: bold; border: none; padding: 14px; width: 100%; border-radius: 6px; font-size: 16px; margin-top: 15px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-upload:hover { background: #e6b800; }
  </style>
</head>
<body>

  <div class="admin-card">
    <h2><i class="fa-solid fa-user-shield"></i> Admin Control Panel</h2>
    
    <form id="adminForm">
      <div class="form-group">
        <label><i class="fa-solid fa-heading"></i> Video Title</label>
        <input type="text" id="vTitle" placeholder="Enter video title..." required>
      </div>

      <div class="form-group">
        <label><i class="fa-solid fa-image"></i> Thumbnail Image Direct Link</label>
        <input type="url" id="vThumb" placeholder="https://i.ibb.co/photo.jpg" required>
      </div>

      <div class="form-group">
        <label><i class="fa-solid fa-video"></i> Video Link(s) (For multiple parts use comma ,)</label>
        <textarea id="vLinks" rows="3" placeholder="https://site.com/part1.mp4, https://site.com/part2.mp4" required></textarea>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label><i class="fa-solid fa-layer-group"></i> Ads Limit</label>
          <input type="number" id="vAdLimit" value="1" min="1" required>
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-clock"></i> Ads Duration (Seconds)</label>
          <input type="number" id="vAdDuration" value="10" min="1" required>
        </div>
      </div>

      <div class="form-group">
        <label><i class="fa-solid fa-link"></i> Adsterra Direct Link (Ads Link)</label>
        <input type="url" id="vAdLink" placeholder="https://www.adsterra-direct-link.com/..." required>
      </div>

      <button type="submit" class="btn-upload"><i class="fa-solid fa-cloud-arrow-up"></i> Upload to User Panel</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAaN2JFDn7SbEGaUWFjxVF6Dk32TaB4h3k",
      authDomain: "viral-zone-f39b4.firebaseapp.com",
      databaseURL: "https://viral-zone-f39b4-default-rtdb.firebaseio.com",
      projectId: "viral-zone-f39b4",
      storageBucket: "viral-zone-f39b4.firebasestorage.app",
      messagingSenderId: "722917065467",
      appId: "1:722917065467:web:ea8904b7185f80f996665e",
      measurementId: "G-GSXHHDSPL0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    document.getElementById('adminForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const title = document.getElementById('vTitle').value;
      const thumbnail = document.getElementById('vThumb').value;
      const rawLinks = document.getElementById('vLinks').value;
      const adLimit = document.getElementById('vAdLimit').value;
      const adDuration = document.getElementById('vAdDuration').value;
      const adLink = document.getElementById('vAdLink').value;

      const partsArr = rawLinks.split(',').map(url => url.trim());

      const payload = {
        title: title,
        thumbnail: thumbnail,
        parts: partsArr,
        adLimit: parseInt(adLimit),
        adDuration: parseInt(adDuration),
        adLink: adLink,
        views: 0,
        likes: 0,
        createdAt: Date.now()
      };

      push(ref(db, 'videos'), payload)
        .then(() => {
          alert('✅ Video uploaded successfully!');
          document.getElementById('adminForm').reset();
        })
        .catch((err) => {
          alert('❌ Upload failed: ' + err.message);
        });
    });
  </script>
</body>
</html>
